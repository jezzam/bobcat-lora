services:
  meshcore-repeater:
    build:
      context: ..
      dockerfile: meshcore-deploy/Dockerfile
    image: meshcore-repeater
    container_name: meshcore-repeater
    # lora_pkt_fwd_1302's config (global_conf_1302.json) points at literal
    # 127.0.0.1:1680 - a container's loopback is its own network-namespace-
    # local loopback, unreachable from the host's 127.0.0.1 without host
    # networking (a hard namespace boundary, not a Docker-Desktop-style gap).
    # No --privileged needed: this container touches no device nodes/GPIO at
    # all, it's a pure UDP socket - narrower than the stock miner container's
    # --privileged --network host --device /dev/i2c-1 pattern.
    network_mode: host
    volumes:
      - /update/meshcore-data:/data
    restart: unless-stopped
    # Keeps stdin open so `docker attach` can drive the admin CLI (docs/
    # cli_commands.md - neighbors, stats-packets, stats-radio, etc.),
    # matching a real device's USB-serial console. Without this, the
    # container's Serial-over-stdin shim (compat/Arduino.h) sees stdin as
    # closed/EOF immediately and `docker attach` has nothing to write into.
    stdin_open: true
    environment:
      # Overrides the compile-time defaults (currently the Brisbane/SEQ
      # MeshCore preset - wiki.mbug.com.au/en/Meshcore/Settings) without a
      # rebuild. FREQ/BW/SF MUST match global_conf_1302.json's actual radio_0/
      # chan_Lora_std tuning on the host - this container has no way to read
      # or verify that file, so keeping the two in sync is a manual step.
      # CR is TX-side only (conveyed per-packet in the explicit LoRa header,
      # not a concentrator setting) - confirmed against the actual nearby
      # repeater's live app settings (screenshot, 2026-07-28): CR 4/5, not
      # the 4/6 the wiki text suggested - see Research_beginning_notes.md.
      MESHCORE_LORA_FREQ: "923.125"
      MESHCORE_LORA_BW: "62.5"
      MESHCORE_LORA_SF: "8"
      MESHCORE_LORA_CR: "5"
      # Companion protocol (phone app) TCP listen port - reachable on the
      # device's LAN IP for free via network_mode: host above, no port
      # mapping needed. Same default the official app expects (matches
      # SerialWifiInterface's TCP_PORT on ESP32 companion_radio boards).
      MESHCORE_TCP_PORT: "5000"
